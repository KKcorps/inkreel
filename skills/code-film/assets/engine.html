<!doctype html>
<meta charset="utf-8">
<title>riso</title>
<style>
  html,body{margin:0;height:100%;background:#0E1016;display:grid;place-items:center;overflow:auto}
  canvas{display:block;box-shadow:0 18px 60px rgba(0,0,0,.55)}
</style>
<canvas id="c"></canvas>
<script>
addEventListener('error', e => { document.title = 'ERR ' + e.message + ' @line ' + e.lineno; });
// ==================================================================
// A RISO PRESS, in a page.
//
// Nothing here is an image. Every frame is computed from (frame, seed)
// onto three ink separations, the DRUMS, which hold DENSITY and nothing
// else. Colour happens at the end, when each drum is halftoned on its own
// screen angle, knocked a few pixels out of register, and multiplied down
// onto paper. The drums can be re-inked for every act, the way a studio
// swaps drums between passes.
//
// Two moves carry the whole thing. Ink ADDS (mark). Ink can be LEFT
// OFF (cut). A shape glows on a dark ground because every drum has a
// hole behind it.
//
// The file is two halves. Everything down to "the world" is the press,
// the anchor, the scene library and the moves, and you should not need to
// touch it. Everything after is the piece: one state, the scenes, the
// acts, their shots and cameras. Three tiny worlds are below as
// demos, a journey, a montage pinned on an anchor, a mechanism with a
// cutaway. Keep the shape you need and delete the rest.
//
//   ?f=120      one frame, full size
//   ?play=1     run the loop
//   ?grid=1     contact sheet, one tile per shot
//   ?grid=3     three tiles per act that has no shots
//   ?scene=id   one scene alone, full bleed, with the anchor. &t=6 &pair=1
//   ?scenes=1   every scene in the library
//   ?cuts=1     the cuts, moves and pinned acts as JSON, for seamcheck.py
//   ?s=11       seed: same drawing, different tremor and slip
// ==================================================================
const Q    = new URLSearchParams(location.search);
const PLAY = Q.get('play') === '1';
const GRID = Q.has('grid') ? Math.max(1, +Q.get('grid') || 1) : 0;
const SEED = +(Q.get('s')   ?? 11);
const CAP  = +(Q.get('fps') ?? 15);
const U    = 1000;                       // the drawing is always 1000 units wide
const W    = +(Q.get('w') ?? (GRID ? 250 : PLAY ? 900 : 1000));
const H    = W, K = W / U;
// dot pitch. a full-size still scales the screen with the sheet; smaller
// sheets hold the pitch in device pixels, so the screen goes coarser and
// the dot count stays sane.
const CELLK = +(Q.get('cellk') ?? (W >= 1000 ? W / U : 1));
const CELL = +(Q.get('cell') ?? 1.7);   // halftone pitch in device px. lower = finer screen. 1.7 is the start, not a rule
const GRAIN = [.06, .09];                // density noise and the uneven pull of the drum. the start, not a rule
const TAU  = Math.PI * 2;
const PAPER = '#F5F1E4';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, k) => a + (b - a) * k;
const ease  = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const seg   = (u, a, b) => b === a ? +(u >= a) : clamp((u - a) / (b - a), 0, 1);   // a sub-beat of a scene
// one easing per kind of move. arrivals slow down, exits speed up, and a thing
// that pops in overshoots a little and settles. that overshoot is most of what
// reads as alive rather than tweened.
const easeOutCubic   = u => 1 - Math.pow(1 - u, 3);
const easeInOutCubic = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeInQuad     = u => u * u;
const easeOutBack    = (u, s = 1.70158) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);

function rng(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(u, v, salt) {
  let h = (u * 374761393 + v * 668265263 + salt * 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function cv(w, h) { const c = document.createElement('canvas'); c.width = w || W; c.height = h || H; return c; }

// a view maps a scene's 0..1000 square onto part of the sheet: a disc, a
// medallion, a coin half way through its flip. every mark made inside view()
// goes through it and is clipped to its outline.
let VIEW = null;
// a raw renderer's cuts and moves, and layers drawn over every frame outside the press
const EXTRA_CUTS = [], EXTRA_MOVES = [], OVERLAYS = [];
function view(v, fn) { const prev = VIEW; VIEW = v; try { fn(); } finally { VIEW = prev; } }
function applyView(g) {
  g.setTransform(K, 0, 0, K, 0, 0);
  if (!VIEW) return;
  if (VIEW.clip) g.clip(VIEW.clip);
  g.transform(...VIEW.m);
}
// a scene in a disc of radius r around (cx, cy), with the scene's anchor on the
// disc's centre. the scene shrinks to fit until r reaches 500, then holds at full
// size while the disc grows over the corners, so a dive never jumps at the end.
// sx squashes it sideways for a coin flip. rot turns it.
function discView(cx, cy, r, { sx = 1, rot = 0 } = {}) {
  const s = Math.min(1, r / 500), ca = Math.cos(rot), sa = Math.sin(rot);
  const clip = new Path2D(); clip.ellipse(cx, cy, Math.max(.01, r * Math.abs(sx)), Math.max(.01, r), rot, 0, TAU);
  const a = ca * s * sx, b = sa * s * sx, c = -sa * s, d = ca * s;
  return { clip, m: [a, b, c, d, cx - (a + c) * 500, cy - (b + d) * 500] };
}

const MONO = 'ui-monospace, Menlo, monospace';
const SANS = 'system-ui, -apple-system, Helvetica, sans-serif';

// soft edges. draw into a scratch of the scratch, then lay it in
// blurred. clipping after a filter snaps the hard edge straight back,
// so it goes through its own canvas.
const TMPC = cv(), TMP = TMPC.getContext('2d');
function soft(g, px, fn) {
  TMP.setTransform(1, 0, 0, 1, 0, 0);
  TMP.globalCompositeOperation = 'source-over';
  TMP.clearRect(0, 0, W, H);
  TMP.save(); TMP.setTransform(K, 0, 0, K, 0, 0); if (VIEW) TMP.transform(...VIEW.m);
  TMP.fillStyle = '#fff'; TMP.strokeStyle = '#fff'; TMP.globalAlpha = 1;
  TMP.lineCap = 'round'; TMP.lineJoin = 'round';
  fn(TMP); TMP.restore();
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = 'blur(' + (px * K) + 'px)';
  g.drawImage(TMPC, 0, 0); g.restore();
}

// ---- shapes ---------------------------------------------------------
function pillPath(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, r); }
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
function ribbon(g, pts, w, tin = 0, tout = 1) {
  // A two point line has ONE segment, sitting at s = 0. Ask it to taper and
  // every segment scales by 0 and the whole stroke prints as a hairline.
  // Subdivide first so the taper has something to run along.
  if (pts.length === 2 && (tin > 0 || tout < 1)) {
    const [[x0, y0], [x1, y1]] = pts, sub = [];
    for (let i = 0; i <= 14; i++) { const t = i / 14; sub.push([lerp(x0, x1, t), lerp(y0, y1, t)]); }
    pts = sub;
  }
  for (let i = 0; i < pts.length - 1; i++) {
    const s = i / (pts.length - 1);
    let k = 1;
    if (tin > 0 && s < tin) k *= s / tin;
    if (tout < 1 && s > tout) k *= (1 - s) / (1 - tout);
    g.lineWidth = Math.max(.7, w * k);
    g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[i + 1][0], pts[i + 1][1]); g.stroke();
  }
}
function arcPath(g, x0, y0, x1, y1, bend) {
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0;
  g.beginPath(); g.moveTo(x0, y0);
  g.quadraticCurveTo(mx - dy * bend, my + dx * bend, x1, y1);
}
// a wavy horizon or water line, as a list of points
function wavy(x0, x1, y, amp, len, phase, n = 40) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const x = lerp(x0, x1, i / n); pts.push([x, y + Math.sin(x / len * TAU + phase) * amp]); }
  return pts;
}

// ---- one ink separation --------------------------------------------
// density lives in the alpha channel, so 'lighter' adds ink and
// 'destination-out' takes it away.
class Sep {
  constructor(colour, angle, cell, dx, dy) {
    Object.assign(this, { colour, angle, cell, dx, dy });
    this.c = cv(); this.g = this.c.getContext('2d', { willReadFrequently: true });
    this.sc = cv(); this.s = this.sc.getContext('2d');
    this.out = cv(); this.o = this.out.getContext('2d');
    this.reset();
  }
  reset() {
    this.g.setTransform(1, 0, 0, 1, 0, 0);
    this.g.globalCompositeOperation = 'source-over';
    this.g.clearRect(0, 0, W, H);
    this.g.globalCompositeOperation = 'lighter';
    this.dirty = false;            // a drum nothing marked this frame is neither grained nor screened
    this.coarse = 1;               // an act may open the screen up for one frame, for a visible halftone glow
  }
  _scratch(fn) {
    const g = this.s;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, W, H);
    g.save(); applyView(g);
    g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.globalAlpha = 1;
    g.lineCap = 'round'; g.lineJoin = 'round';
    fn(g); g.restore();
  }
  mark(d, fn) {                                   // lay ink down
    this.dirty = true;
    this._scratch(fn);
    this.g.globalCompositeOperation = 'lighter';
    this.g.globalAlpha = clamp(d, 0, 1);
    this.g.drawImage(this.sc, 0, 0);
    this.g.globalAlpha = 1;
  }
  cut(d, fn) {                                    // leave ink off
    this._scratch(fn);
    this.g.globalCompositeOperation = 'destination-out';
    this.g.globalAlpha = clamp(d, 0, 1);
    this.g.drawImage(this.sc, 0, 0);
    this.g.globalAlpha = 1;
    this.g.globalCompositeOperation = 'lighter';
  }
  flood(d) { this.mark(d, g => g.fillRect(0, 0, U, U)); }
  band(y0, y1, d, op = 'mark') { this[op](d, g => g.fillRect(-10, y0, U + 20, y1 - y0)); }
  vgrad(stops, op = 'mark') {
    this[op](1, g => {
      const gr = g.createLinearGradient(0, 0, 0, U);
      for (const [p, v] of stops) gr.addColorStop(p, 'rgba(255,255,255,' + v + ')');
      g.fillStyle = gr; g.fillRect(0, 0, U, U);
    });
  }
  glow(x, y, r, d, mid = .38, op = 'mark') {
    this[op](d, g => {
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(mid, 'rgba(255,255,255,.45)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    });
  }
  disc(x, y, r, d, op = 'mark') { this[op](d, g => { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }); }
  ring(x, y, r, w, d, op = 'mark') { this[op](d, g => { g.lineWidth = w; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke(); }); }
  shape(pts, d, op = 'mark') { this[op](d, g => { poly(g, pts); g.fill(); }); }
  strokes(paths, { w = 3, d = 1, tin = 0, tout = 1, op = 'mark' } = {}) {
    this[op](d, g => { for (const p of paths) ribbon(g, p, w, tin, tout); });
  }
  // every label on a plate in ONE pass. a mark costs a whole sheet, so
  // anything that repeats gets batched or the frame rate dies.
  labels(items, size, d, { align = 'left', font = MONO, weight = 500, op = 'mark', base = 'middle' } = {}) {
    this[op](d, g => {
      g.font = weight + ' ' + size + 'px ' + font;
      g.textAlign = align; g.textBaseline = base;
      for (const [s, x, y] of items) g.fillText(s, x, y);
    });
  }
  text(s, x, y, size, d, o) { this.labels([[s, x, y]], size, d, o); }
  grain(amount, uneven) {
    const gr = rng((SEED * 7919 + Math.round(this.angle * 13)) >>> 0);
    const N = 9, fld = [];
    for (let i = 0; i < (N + 1) * (N + 1); i++) fld.push(gr());
    const bil = (u, v) => {
      const fx = u * N, fy = v * N;
      const x0 = Math.min(N - 1, Math.floor(fx)), y0 = Math.min(N - 1, Math.floor(fy));
      const ax = fx - x0, ay = fy - y0;
      const a = fld[y0 * (N + 1) + x0], b = fld[y0 * (N + 1) + x0 + 1];
      const c = fld[(y0 + 1) * (N + 1) + x0], e = fld[(y0 + 1) * (N + 1) + x0 + 1];
      return (a * (1 - ax) + b * ax) * (1 - ay) + (c * (1 - ax) + e * ax) * ay;
    };
    const img = this.g.getImageData(0, 0, W, H), p = img.data;
    for (let y = 0; y < H; y++) {
      const vy = y / H;
      let un = 1;
      for (let x = 0; x < W; x++) {
        if ((x & 7) === 0) un = 1 + (bil(x / W, vy) - .5) * uneven;
        const i = (y * W + x) << 2;
        const a0 = p[i + 3];
        if (a0 === 0) continue;
        let v = a0 / 255;
        v *= un; v += (gr() - .5) * amount * Math.sqrt(v) * (1 - v * .6);
        p[i + 3] = clamp(v, 0, 1) * 255;
      }
    }
    this.g.putImageData(img, 0, 0);
  }
  // Halftone, walked per pixel instead of per dot.
  //
  // The path version asked the canvas to build one node per dot, and at a
  // 1.7px pitch that is a quarter million nodes a plate. This inverts it:
  // step across the pixels, carry the lattice coordinate incrementally so
  // the rotation costs two adds, and only when the pixel crosses into a new
  // cell do the expensive parts, fetch the density, size the dot. That is
  // W/c times a row rather than W. Cost now scales with the SHEET, not with
  // how fine the screen is.
  screen() {
    const o = this.o, c = this.cell * CELLK * this.coarse;
    const a = this.angle * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    const src = this.g.getImageData(0, 0, W, H).data;
    const img = o.createImageData(W, H), buf = new Uint32Array(img.data.buffer);
    const R8 = parseInt(this.colour.slice(1, 3), 16),
          G8 = parseInt(this.colour.slice(3, 5), 16),
          B8 = parseInt(this.colour.slice(5, 7), 16);
    const INK = (0xFF000000 | (B8 << 16) | (G8 << 8) | R8) >>> 0;
    buf.fill(0xFFFFFFFF);

    const salt = (SEED * 131 + Math.round(this.angle * 7)) | 0;
    const dxk = this.dx * K, dyk = this.dy * K;
    const inv = 1 / c, cx0 = W / 2 + dxk, cy0 = H / 2 + dyk;
    const duX = ca * inv, dvX = -sa * inv;

    for (let y = 0; y < H; y++) {
      const py = y - cy0, row = y * W;
      let lu = (-cx0 * ca + py * sa) * inv;
      let lv = (cx0 * sa + py * ca) * inv;
      let lastU = 2147483647, lastV = 2147483647;
      let dcx = 0, dcy = 0, rr = -1, r2i = 0, r2o = 0;
      for (let x = 0; x < W; x++, lu += duX, lv += dvX) {
        const cu = Math.round(lu), cv = Math.round(lv);
        if (cu !== lastU || cv !== lastV) {
          lastU = cu; lastV = cv;
          const bx = (cu * ca - cv * sa) * c + W / 2;
          const by = (cu * sa + cv * ca) * c + H / 2;
          const xi = bx | 0, yi = by | 0;
          let d = 0;
          if (xi >= 0 && yi >= 0 && xi < W && yi < H) d = src[((yi * W + xi) << 2) + 3] / 255;
          if (d <= .012) { rr = -1; }
          else {
            rr = c * .70 * Math.sqrt(d) * (.95 + .10 * hash2(cu, cv, salt));
            dcx = bx + dxk + (hash2(cu, cv, salt + 7919) - .5) * c * .10;
            dcy = by + dyk + (hash2(cu, cv, salt + 104729) - .5) * c * .10;
            const ri = rr - .5, ro = rr + .5;
            r2i = ri > 0 ? ri * ri : 0;
            r2o = ro * ro;
          }
        }
        if (rr < 0) continue;
        const ex = x - dcx, ey = y - dcy, dd = ex * ex + ey * ey;
        if (dd >= r2o) continue;
        if (dd <= r2i) { buf[row + x] = INK; continue; }
        let k = rr + .5 - Math.sqrt(dd);           // soft edge, one pixel wide
        k = k < 0 ? 0 : k > 1 ? 1 : k;
        const ik = 1 - k;
        buf[row + x] = (0xFF000000
          | (((B8 * k + 255 * ik) | 0) << 16)
          | (((G8 * k + 255 * ik) | 0) << 8)
          | ((R8 * k + 255 * ik) | 0)) >>> 0;
      }
    }
    o.putImageData(img, 0, 0);
    return this.out;
  }
}

// ---- the inks --------------------------------------------------------
// A riso studio owns a shelf of drums and picks three for a job. This is
// that shelf. Every act may re-ink the press, and a piece that never does
// prints every scene in the same three colours, which is the tell of a
// computed piece. Keep one ink across the whole piece as its motif colour
// and let the other two change with the scene.
const INKS = {
  black: '#1A1A1A',            blue: '#1B4FC8',              'federal blue': '#3D5588',
  cornflower: '#62A8E5',       aqua: '#5EC8E5',              teal: '#00838A',
  green: '#00A95C',            'kelly green': '#67B346',     mint: '#82D8D5',
  yellow: '#FFD41A',           sunflower: '#FFB511',         orange: '#FF6C2F',
  'bright red': '#F15060',     pink: '#FF4FA6',              purple: '#765BA7',
  burgundy: '#914E72',         brown: '#925F52',             grey: '#88898A',
  'riso blue': '#0078BF',      'fluorescent pink': '#FF48B0', indigo: '#2E3192',
};

// three drums on the classic rosette angles, so the dots interleave instead
// of stacking into moire. the registration slip is set once: a press is out
// of register the same way on every pull. the drums are named by their job,
// dark draws, bright fills, light washes. the classic ink names still work.
const RS = rng((SEED * 2654435761) >>> 0);
const drum = (colour, angle, cellMul) => new Sep(colour, angle, CELL * cellMul, (RS() - .5) * 5, (RS() - .5) * 5);
function press() {
  const p = { dark: drum(INKS.blue, 15, 1), bright: drum(INKS.pink, 75, 1), light: drum(INKS.yellow, 45, 1.18) };
  p.blue = p.dark; p.pink = p.bright; p.yellow = p.light;
  return p;
}
// two presses. most frames use one. a transition that opens one scene over
// another prints the incoming scene on the second press, so each keeps its own
// three inks and neither changes colour mid cut. a press nobody touched this
// frame costs nothing.
const PRESSES = [press(), press()];
let S = PRESSES[0];
function onPress(i, fn) { const prev = S; S = PRESSES[i]; try { fn(S); } finally { S = prev; } }
const DRUMS = ['dark', 'bright', 'light'];
const DEFAULT_INKS = ['blue', 'pink', 'yellow'];
// a callback reprints an old scene in new inks: swapped for a rewind, drained to
// one for loss, two for a pair. set it, draw, clear it. pull() clears it anyway.
let INKMAP = null;
// an ink is a name from the chart or a #RRGGBB. anything else prints near black
// and makes the anchor's darkness check NaN, so it throws instead
function inkHex(c) {
  const h = INKS[c] || c;
  if (!/^#[0-9a-f]{6}$/i.test(h)) throw new Error(`unknown ink '${c}'. use a name from INKS or #RRGGBB`);
  return h;
}
function inks(dark, bright, light) {
  if (INKMAP) [dark, bright, light] = INKMAP(dark, bright, light);
  S.dark.colour = inkHex(dark);
  S.bright.colour = inkHex(bright);
  S.light.colour = inkHex(light);
}
// the anchor's own press: two drums, picked once per piece and never re-inked
// after that. the first prints the anchor and the lettering, the second sits
// under it, out of register, so the anchor shows a thin fringe on one side the
// way a two colour print does. the second drum alone is the second voice.
// indigo over fluorescent pink is where every piece so far started. pick a
// first ink dark enough to read on paper, because seamcheck finds the dot by it.
const ANCHOR_INKS = ['indigo', 'fluorescent pink'];
const anchorPress = () => ({ ink: new Sep(inkHex(ANCHOR_INKS[0]), 0, CELL, 0, 0), fringe: new Sep(inkHex(ANCHOR_INKS[1]), 30, CELL, 2.6, -1.9) });
let A = anchorPress();

// grounds. the sheet before the subject goes on. alternate light and dark
// across the running order, and re-ink so two dark grounds are not the same
// dark. with a black or federal blue dark drum, `night` is a real night.
const ground = {
  paper: () => {},
  flat:  (d = 'light', k = .5) => S[d].flood(k),
  wash:  (d = 'dark', a = .10, b = .30) => S[d].vgrad([[0, a], [1, b]]),
  warm:  () => { S.light.flood(.50); S.bright.vgrad([[0, .05], [1, .17]]); },
  deep:  () => { S.dark.vgrad([[0, .60], [1, .86]]); S.bright.vgrad([[0, .17], [1, .37]]); S.light.vgrad([[0, .02], [1, .14]]); },
  night: () => { S.dark.flood(.94); S.bright.vgrad([[0, .10], [1, .40]]); },
};

// On a dark ground, taking one drum off is not enough. The other two are
// still on the sheet and the shape comes back muddy. A HOLE lifts all
// three, so the shape prints as bare paper and actually glows.
const hole = (d, fn) => { for (const k of DRUMS) S[k].cut(d, fn); };
// Ink multiplies. A light ink drawn over a dark flood prints black, so a
// bright line on a dark ground is a HOLE first and the tint on top. This is
// the single most common way a dark act comes back empty.
const lit = (drum, d, fn) => { hole(d, fn); S[drum].mark(d, fn); };
// a hole through every press, for anything that must read over two scenes at
// once: a caption, the anchor's halo, a ripple crossing a disc.
// the presses this frame prints on. bake() points it at its own press, so a
// baked scene never cuts holes in the frame that happened to bake it
let LIVE = PRESSES;
const holeAll = (d, fn) => { const prev = S; try { for (const p of LIVE) { S = p; hole(d, fn); } } finally { S = prev; } };
const holeLabels = (items, size, d, o) => { for (const k of DRUMS) S[k].labels(items, size, d, { ...o, op: 'cut' }); };

// ---- the camera -------------------------------------------------------
// World units are whatever the piece says they are. An act's cam(W, u)
// returns [cx, cy, width]: the point it looks at and how many world units fit

// ================= the anchor ======================================
// ONE SMALL THING PINNED TO ONE SPOT. The dot sits on the centre of the
// sheet through the first half, and every scene is drawn so it lands on
// something that matters: the dial's hub, the lamp, the flower's heart. That
// is what lets twenty unrelated pictures read as one piece, because every hard
// cut lines up on the same point. Ripples leave it, discs open on it, dives go
// through it. It is one film's grammar, not a default. reference/moves.md owns all of this.
const ANCHOR_R = 11;                                   // 2.2 percent of the frame
// the grid. every act is whole beats and the loop whole bars, so every cut lands
// on a kick. shots inside an act sit on sixteenths. pick the pace per piece:
// 16 frames a beat at 18 fps is 67.5 BPM and is where to start, 12 or 20 frames
// a beat and 15 to 24 fps all work. the score and build.sh read BEAT and FPS from here.
const BEAT = 16, BAR = 4 * BEAT;

function darkAt(x, y) {
  const px = clamp(Math.round(x * K), 0, W - 1), py = clamp(Math.round(y * K), 0, H - 1);
  let L = 1;

    if (!p[k].dirty) continue;
    const d = p[k].g.getImageData(px, py, 1, 1).data[3] / 255;
    L *= 1 - d * (1 - lumOf(p[k].colour));

  for (let i = 0; i < 8; i++) m = Math.max(m, darkAt(x + Math.cos(i * TAU / 8) * r * 1.5, y + Math.sin(i * TAU / 8) * r * 1.5));
  return m;

function anchorDot(x, y, r = ANCHOR_R, { halo = 'auto', second = false, core = 0 } = {}) {

// ================= the scenes ======================================
// Every scene is one bold subject you can read in a quarter of a second, drawn
// in 0..1000 units around the anchor at (500, 500), in its own three inks. The
// anchor lands on the thing that matters. Most scenes hold a set of arcs, of
// sound or light or water, that rhyme with the ripples. t is frames since the

  inks(...sc.ink);
  view(v, () => sc.draw(S, t, rng(hashStr(id))));

// ================= the moves =======================================
// Every transition is a circle on the anchor, so the transitions are the motif
// too. Each move has its own easing and its own length on the grid.
const SIXTEENTH = BEAT / 4;
const DISC_R = 275;                                    // a tiny world, 55 percent of the frame
const OPEN_R = 150;                                    // a dive opens this big first, inside the last picture
const MOVE_FRAMES = { grow: 6, coin: 7, slide: 8, dive: 15, iris: 9 };   // how long each move runs, for seamcheck

// showing on one side as it turns.
function discOn(id, t, r, o = {}) {
  const cx = o.cx ?? 500, cy = o.cy ?? 500, sx = o.sx ?? 1, rot = o.rot ?? 0;
  const ell = (g, rx, ox = 0) => { g.beginPath(); g.ellipse(cx + ox, cy, Math.max(.01, rx), r, rot, 0, TAU); };
  if (o.coin) {
    inks(...SCN[id].ink);
    S.dark.mark(.95, g => { ell(g, r * sx, r * .09 * (1 - sx)); g.fill(); });   // the coin's edge
    hole(1, g => { ell(g, r * sx); g.fill(); });

function over(lower, id, t, r, o = {}) {

//   coin   a disc that flips in like a coin, its edge showing
//   slide  a disc that slides in from the right, turning a little
//   dive   a disc opens on the anchor over the last shot, then fills the frame
//   iris   the scene opens out of the anchor over bare paper

  const out = BAKE[id] = { dark: cv(BS, BS), bright: cv(BS, BS), light: cv(BS, BS), drain: cv(BS, BS) };
  const keep = INKMAP, was = S, wasA = A, wasLive = LIVE;
  INKMAP = null; S = BAKER; A = BAKER_A; LIVE = [BAKER];
  try {
    for (const k of DRUMS) S[k].reset();
    drawScene(id, 8);
    for (const k of DRUMS) out[k].getContext('2d').drawImage(S[k].c, 0, 0, W, H, 0, 0, BS, BS);
    const lum = DRUMS.map(k => lumOf(S[k].colour));
    const px = DRUMS.map(k => out[k].getContext('2d').getImageData(0, 0, BS, BS).data);
    const dc = out.drain.getContext('2d'), im = dc.createImageData(BS, BS);
    for (let i = 0; i < BS * BS; i++) {
      let L = 1;
      for (let j = 0; j < 3; j++) L *= 1 - px[j][i * 4 + 3] / 255 * (1 - lum[j]);
      im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = 255;
      im.data[i * 4 + 3] = Math.min(255, (1 - L) * 300);
    }
    dc.putImageData(im, 0, 0);
    for (const k of DRUMS) S[k].reset();
    BAKER_A.ink.reset(); BAKER_A.fringe.reset();
  } finally {
    INKMAP = keep; S = was; A = wasA; LIVE = wasLive;
  }
  return out;
}
// list of { id, x, y, r }. k is how far they have drained to one ink.
function medallions(list, k = 0) {
  list = list.filter(m => m.r > .5);
  if (!list.length) return;
  for (const m of list) bake(m.id);
  hole(1, g => { for (const m of list) { g.beginPath(); g.arc(m.x, m.y, m.r, 0, TAU); g.fill(); } });
  const put = (g, m, key, a, op = 'source-over') => {
    g.save(); g.beginPath(); g.arc(m.x, m.y, m.r, 0, TAU); g.clip();
    g.globalAlpha = a; g.globalCompositeOperation = op;
    g.drawImage(BAKE[m.id][key], m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
    g.restore();
  };
  S.dark.mark(1, g => { for (const m of list) { put(g, m, 'dark', 1 - k); if (k > 0) put(g, m, 'drain', k, 'lighter'); } });
  if (k < 1) S.bright.mark(1, g => { for (const m of list) put(g, m, 'bright', 1 - k); });
  if (k < 1) S.light.mark(1, g => { for (const m of list) put(g, m, 'light', 1 - k); });
  S.dark.mark(.75, g => { g.lineWidth = 2.2; for (const m of list) { g.beginPath(); g.arc(m.x, m.y, m.r, 0, TAU); g.stroke(); } });
}

// ================= the world =======================================
// THE ONE THING THAT MAKES THIS A STORY AND NOT AN ANTHOLOGY.
// There is a single piece of state, simulated forward a frame at a time from
// frame 0, and every act draws THAT SAME state. The state is a subject you
// can name. A boat on its journey, a record spinning, a gear turning. Not a
// grid unless the topic is a grid. Below are three tiny worlds to copy from,
// one per story shape (reference/story.md). Keep one, delete the others,
// rename everything.
function freshWorld() {
  return {
    frame: -1,
    boat: { x: 120, bob: 0, weather: 0 },   // the journey. x runs left to right across the piece
    ripples: [], blue: [500, 500], pink: [500, 500],   // the montage. ripples leave the anchor, one an eighth
    gear: { angle: 0, turns: 0 },           // the mechanism. a cutaway and the real thing
  };
}
function stepWorld(W, f) {
  const r = rng((SEED * 31 + f * 2654435761) >>> 0);   // per frame, so any frame is reproducible
  W.frame = f;
  const [act, u] = actAt(f);
  const fa = f - act.start;
  if (['lake', 'storm', 'night'].includes(act.name)) {
    W.boat.x += act.name === 'storm' ? 4.2 : 6.5;
    W.boat.weather = act.name === 'storm' ? Math.min(1, W.boat.weather + .06) : Math.max(0, W.boat.weather - .04);
    W.boat.bob = Math.sin(f * .28) * (6 + 16 * W.boat.weather);
  }
  if (act.name === 'montage' && fa % (BEAT / 2) === 0) W.ripples.push({ born: f, voice: 'anchor', x: 500, y: 500, seed: f % 97 + 1 });   // a ripple an eighth, from the anchor
  W.ripples = W.ripples.filter(r => f - r.born < (r.life || LIFE));
  if (['plan', 'gear'].includes(act.name) || (act.name === 'close' && u < .5)) { W.gear.angle += .035; if (fa % BEAT === 0) W.gear.turns++; }   // it stops turning on the final hit
}
let CACHE = null;
function worldAt(f) {
  if (!CACHE || CACHE.frame > f) CACHE = { frame: -1, W: freshWorld() };
  while (CACHE.frame < f) { CACHE.frame++; stepWorld(CACHE.W, CACHE.frame); }
  return CACHE.W;
}

// ---- things the demo worlds draw. yours will be different --------------
function paperBoat(S, x, y, s, { dark = true } = {}) {
  const hull = [[x - 52 * s, y], [x + 52 * s, y], [x + 36 * s, y + 24 * s], [x - 36 * s, y + 24 * s]];
  const sail = [[x - 8 * s, y], [x - 8 * s, y - 58 * s], [x + 34 * s, y]];
  const jib = [[x - 8 * s, y - 58 * s], [x - 40 * s, y], [x - 8 * s, y]];
  const draw = g => { poly(g, hull); g.fill(); poly(g, sail); g.fill(); poly(g, jib); g.fill(); };
  if (dark) hole(1, draw); else S.light.mark(.0, draw);            // on a light ground the boat is the paper itself
  S.dark.mark(.9, g => { g.lineWidth = 3.5 * s; for (const p of [hull, sail, jib]) { poly(g, p); g.stroke(); } });
}
function gearPath(g, x, y, r, teeth, angle, depth = .16) {
  g.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a0 = angle + (i / (teeth * 2)) * TAU, a1 = angle + ((i + 1) / (teeth * 2)) * TAU, rr = i % 2 ? r : r * (1 + depth);
    if (i === 0) g.moveTo(x + Math.cos(a0) * rr, y + Math.sin(a0) * rr);
    g.arc(x, y, rr, a0, a1);
    g.lineTo(x + Math.cos(a1) * (i % 2 ? r * (1 + depth) : r), y + Math.sin(a1) * (i % 2 ? r * (1 + depth) : r));
  }
  g.closePath();
}

function drawRipples(W, cam) {
  for (const r of W.ripples || []) {
    const [x, y] = r.local ? [r.x, r.y] : at(cam, r.x, r.y);
    ripple(r.voice === 'second' ? A.fringe : A.ink, x, y, W.frame - r.born, { seed: r.seed, w: r.w ?? 7, reach: r.reach ?? 760, life: r.life ?? LIFE, s: r.local ? 1 : cam.s, ticks: r.ticks ?? 3 });
  }
}

const SCENES = [];

// { raw: (ctx, u, f, size) => {} } draws the act with a second renderer straight

// second framing for u >= .5, so seamcheck.py does not call it a pop.

// ---- timeline -------------------------------------------------------

// the captions, one sentence an act, as data on the beat grid, in the anchor's
// ink. a line starts writing at `from`, is written by `to`, holds until
// `off`, all in beats. a sentence may run over a cut. the demo worlds have none.
const CAPTIONS = [];
function drawCaptions(f) {
  const b = f / BEAT;
  CAPTIONS.forEach((c, i) => {
    if (b < c.from || b >= c.off) return;
    hand(S, c.text, { x: c.x, y: c.y, fit: c.fit, rot: c.rot, ink: A.ink, d: .95, p: seg(b, c.from, c.to), seed: i + 1 });
  });
}

// ---- timeline -------------------------------------------------------
let TOTAL = 0;
for (const s of SCENES) {
  s.start = TOTAL; TOTAL += s.frames;
  if (s.shots) { const n = s.shots.reduce((a, e) => a + (Array.isArray(e) ? e[1] : e), 0) * SIXTEENTH; if (n !== s.frames) throw new Error('act ' + s.name + ' shots add to ' + n + ' frames, not ' + s.frames); }
  // a shot shorter than its move cuts away mid move, a half open disc
  for (const e of s.shots || []) if (Array.isArray(e) && MOVE_FRAMES[e[2]] > e[1] * SIXTEENTH) throw new Error(`act ${s.name}: shot ${e[0]} is ${e[1] * SIXTEENTH} frames, its ${e[2]} needs ${MOVE_FRAMES[e[2]]}`);
}
function frameAt(frame) {
  const f = ((frame % TOTAL) + TOTAL) % TOTAL;
  for (const s of SCENES) if (f < s.start + s.frames) return [s, (f - s.start) / s.frames, f];
  return [SCENES[0], 0, 0];
}
const actAt = frameAt;
function shotOf(act, fa) {
  if (!act.shots) return { i: 0, fa, n: act.frames, u: fa / act.frames, id: null };
  let s = 0;
  for (let i = 0; i < act.shots.length; i++) {
    const e = act.shots[i], len = (Array.isArray(e) ? e[1] : e) * SIXTEENTH;
    if (fa < s + len || i === act.shots.length - 1) return { i, fa: fa - s, n: len, u: (fa - s) / len, id: Array.isArray(e) ? e[0] : null };
    s += len;
  }
}

// ---- the press ------------------------------------------------------
const SHEET = cv(), SH = SHEET.getContext('2d');
const TOOTH = (() => {
  const n = cv(), g = n.getContext('2d'), im = g.createImageData(W, H), p = im.data, nr = rng(SEED * 31 + 5);
  for (let i = 0; i < W * H; i++) { const v = 234 + nr() * 21; p[i * 4] = p[i * 4 + 1] = p[i * 4 + 2] = v; p[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); return n;
})();
const ALL = () => [...PRESSES.flatMap(p => [p.light, p.dark, p.bright]), A.fringe, A.ink];

const PROF = { draw: 0, grain: 0, screen: 0, comp: 0 };
// ?scene=phone&t=6 prints one scene on its own, full bleed, with the anchor
const SOLO = Q.get('scene');
function pull(frame, { overlays = true } = {}) {
  const _t = () => performance.now();
  let _a = _t();
  const [sc, u, f] = frameAt(frame);
  const Wld = worldAt(f);
  const cam = camAt(f, sc, u, Wld);
  // a raw act draws its frame straight onto the sheet with its own renderer
  if (sc.raw) { sc.raw(SH, u, f, W); if (overlays) for (const o of OVERLAYS) o(SH, f, W); return [sc, f]; }
  for (const d of ALL()) d.reset();
  INKMAP = null; VIEW = null;
  onPress(1, () => inks(...DEFAULT_INKS));
  S = PRESSES[0];
  inks(...DEFAULT_INKS);                       // every act starts from the house inks and may re-ink
  if (SOLO) { drawScene(SOLO, +(Q.get('t') ?? 6)); if (Q.get('pair') === '1') anchorDot(...SCN[SOLO].pair, ANCHOR_R, { second: true }); anchorDot(500, 500); }
  else {
    sc.fn(S, u, Wld, cam, shotOf(sc, f - sc.start));
    S = PRESSES[0]; INKMAP = null; VIEW = null;
    drawRipples(Wld, cam);
    drawCaptions(f);
    if (sc.pin) anchorDot(500, 500);
  }
  PROF.draw += _t() - _a; _a = _t();
  for (const d of ALL()) if (d.dirty) d.grain(...GRAIN);
  PROF.grain += _t() - _a; _a = _t();
  SH.setTransform(1, 0, 0, 1, 0, 0);
  SH.globalCompositeOperation = 'source-over';
  SH.fillStyle = PAPER; SH.fillRect(0, 0, W, H);
  SH.globalCompositeOperation = 'multiply';
  for (const d of ALL()) if (d.dirty) SH.drawImage(d.screen(), 0, 0);
  PROF.screen += _t() - _a; _a = _t();
  SH.globalAlpha = .08; SH.drawImage(TOOTH, 0, 0);
  SH.globalAlpha = 1; SH.globalCompositeOperation = 'source-over';
  if (overlays) for (const o of OVERLAYS) { SH.save(); o(SH, f, W); SH.restore(); }
  return [sc, f];
}

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');

if (Q.get('capture') === '1') {
  // one page load, every frame rendered on demand. the capture script drives
  // this over CDP, so Chrome starts once instead of once per frame.
  cvs.width = W; cvs.height = H;
  window.__frames = TOTAL;
  window.__render = f => { pull(f); ctx.drawImage(SHEET, 0, 0); return TOTAL; };
  window.__render(0);
  document.title = 'capture ready ' + TOTAL;
} else if (Q.get('cuts') === '1') {
  // for seamcheck.py: every frame a cut is meant to land on, and every frame
  // the anchor is meant to sit still on the centre
  const cuts = [], pinned = [], names = {}, moves = [];
  for (const s of SCENES) {
    cuts.push(s.start); names[s.start] = s.name;
    if (s.shots) { let a = s.start; for (const e of s.shots) { cuts.push(a); names[a] = s.name + (Array.isArray(e) ? ' ' + e[0] : ''); if (Array.isArray(e) && MOVE_FRAMES[e[2]]) moves.push([a, a + MOVE_FRAMES[e[2]]]); a += (Array.isArray(e) ? e[1] : e) * SIXTEENTH; } }
    for (const [u0, u1] of s.moves || []) moves.push([s.start + Math.round(u0 * s.frames), s.start + Math.round(u1 * s.frames)]);
    for (const u of s.cutsAt || []) { const c = s.start + Math.round(u * s.frames); cuts.push(c); names[c] = s.name + ' shot 2'; }
    if (s.pin) pinned.push([s.start, s.start + s.frames]);
  }
  cuts.push(...EXTRA_CUTS); moves.push(...EXTRA_MOVES);
  document.title = 'cuts ' + JSON.stringify({ total: TOTAL, fps: FPS, cuts: [...new Set(cuts)].sort((a, b) => a - b), pinned, names, moves, anchor: lumOf(A.ink.colour) });
} else if (Q.has('bench')) {
  cvs.width = W; cvs.height = H;
  const n = +Q.get('bench') || 20, t0 = performance.now();
  for (let i = 0; i < n; i++) pull(Math.floor(i * TOTAL / n));
  const ms = (performance.now() - t0) / n;
  ctx.drawImage(SHEET, 0, 0);
  document.title = 'bench w=' + W + ' ' + ms.toFixed(0) + 'ms | draw ' + (PROF.draw/n).toFixed(0) + ' grain ' + (PROF.grain/n).toFixed(0) + ' screen ' + (PROF.screen/n).toFixed(0) + ' ready';
} else if (GRID || Q.get('scenes') === '1') {
  // the contact sheet, one tile per shot, so every picture gets checked at once.
  // ?scenes=1 is every scene in the library instead.
  const shots = [];
  if (Q.get('scenes') === '1') for (const id of Object.keys(SCN)) shots.push({ id });
  else for (const s of SCENES) {
    if (s.shots) { let a = s.start; for (const e of s.shots) { const len = (Array.isArray(e) ? e[1] : e) * SIXTEENTH; shots.push({ fr: a + Math.min(len - 1, Math.floor(len * .6)) }); a += len; } }
    else for (let i = 0; i < GRID; i++) shots.push({ fr: s.start + Math.floor(s.frames * (i + .5) / GRID) });
  }
  const cols = Math.ceil(Math.sqrt(shots.length * 1.15)), rows = Math.ceil(shots.length / cols);
  cvs.width = cols * W; cvs.height = rows * H;
  ctx.fillStyle = '#0E1016'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  shots.forEach((s, i) => {
    let tag;
    if (s.id) { pullSolo(s.id); tag = s.id; }
    else { const [sc, f] = pull(s.fr); const sh = shotOf(sc, f - sc.start); tag = String(f).padStart(3, '0') + ' ' + sc.name + (sh.id ? ' ' + sh.id : ''); }
    const px = (i % cols) * W, py = Math.floor(i / cols) * H;
    ctx.drawImage(SHEET, px, py);
    ctx.font = '500 ' + Math.round(W * .046) + 'px ' + MONO;
    ctx.fillStyle = 'rgba(245,241,228,.94)';
    ctx.fillRect(px + 4, py + 4, ctx.measureText(tag).width + 12, W * .075);
    ctx.fillStyle = '#1B4FC8';
    ctx.textBaseline = 'middle'; ctx.fillText(tag, px + 10, py + 4 + W * .0375);
  });
  document.title = 'grid ' + shots.length + ' of ' + TOTAL + ' ready';
} else if (!PLAY) {
  cvs.width = W; cvs.height = H;
  const [sc] = pull(+(Q.get('f') ?? 0));
  ctx.drawImage(SHEET, 0, 0);
  document.title = (SOLO || sc.name) + ' ready';
} else {
  cvs.width = W; cvs.height = H;
  let frame = +(Q.get('f') ?? 0), last = performance.now(), paused = false;
  addEventListener('keydown', e => { if (e.key === ' ') { paused = !paused; e.preventDefault(); } });
  const tick = () => {
    last = performance.now();
    if (!paused) { pull(frame); ctx.drawImage(SHEET, 0, 0); frame++; }
    setTimeout(() => requestAnimationFrame(tick), Math.max(0, 1000 / CAP - (performance.now() - last)));
  };
  document.title = 'playing';
  requestAnimationFrame(tick);
}
// one scene alone, for the library sheet
function pullSolo(id) {
  for (const d of ALL()) d.reset();
  INKMAP = null; VIEW = null; S = PRESSES[0];
  drawScene(id, 6);
  anchorDot(500, 500);
  for (const d of ALL()) if (d.dirty) d.grain(...GRAIN);
  SH.setTransform(1, 0, 0, 1, 0, 0); SH.globalCompositeOperation = 'source-over';
  SH.fillStyle = PAPER; SH.fillRect(0, 0, W, H);
  SH.globalCompositeOperation = 'multiply';
  for (const d of ALL()) if (d.dirty) SH.drawImage(d.screen(), 0, 0);
  SH.globalAlpha = .08; SH.drawImage(TOOTH, 0, 0);
  SH.globalAlpha = 1; SH.globalCompositeOperation = 'source-over';
}
</script>
