<!doctype html>
<meta charset="utf-8">
<title>print still: owl</title>
<style>
  html,body{margin:0;height:100%;background:#0E1016;display:grid;place-items:center;overflow:auto}
  canvas{display:block;box-shadow:0 18px 60px rgba(0,0,0,.55)}
</style>
<canvas id="c"></canvas>
<script>
addEventListener('error', e => { document.title = 'ERR ' + e.message + ' @line ' + e.lineno; });
// ==================================================================
// A PRINT STILL. One frame, no animation, built to show the flat-fill
// model and the finish passes that reference/surface.md owns.
//
// THE OWL, third pass. Flat fill plus clipped finish (the architecture
// borrowed from alesha-pro/tools hand-drawn-canvas-animation, MIT), now
// with the eight things the last pass was still missing:
//
//  1 HALFTONE SCALE     one cell for everything read as a motif. now the
//                       owl is screened fine and the field coarse and pale.
//  2 FREQUENCY LADDER   three levels on purpose. broad dark masses carry
//                       no fine dots, feather marks are the middle, grain
//                       is the bottom. the background gives up detail so
//                       the owl can have it.
//  3 CONTOUR MODULATION every outline is segments of uneven width that
//                       wander and drop out. no constant-width stroke.
//  4 INK COVERAGE       ONE shared low frequency field, sampled by every
//                       screen and every fill, offset per ink. This is the
//                       spine of the whole thing: the unevenness belongs
//                       to the sheet, not to a noise layer on top of it.
//  5 REGISTRATION       coloured fringes: a shifted copy of a fill in a
//                       neighbouring ink, at the edge, on most shapes.
//  6 MARK MORPHOLOGY    short tapered angular feather marks laid along
//                       tracts, not long decorative curves.
//  7 VALUE HIERARCHY    pale outer field, dense dark centre.
//  8 LAYER INTEGRATION  the grass gets the same screen, grain and edge
//                       decay as everything around it.
//
//  9  EDGE ACUTANCE     a softening pass over the WHOLE composite, so
//                       outlines and dots are absorbed into the surface
//                       instead of sitting on it.
// 10  CHROMATIC GRAIN   fine coloured speckle everywhere, amplitude rising
//                       with ink density, so darks mottle red and green.
// 11  INK SPREAD        red and blue are sampled from slightly different
//                       places, so boundaries go permeable and fringe.
// 12  DOT INTEGRATION   every dot gets a soft halo and one of three
//                       opacities, so no dot is a crisp circle on a fill.
//
//   ?w=1080 ?ss=2 ?flat=1 (no screens) ?field=1 (the ink field)
//   ?soft=0.55 (blur px) ?chroma=1 (grain amount) ?spread=2.2 (fringe px)
// ==================================================================
const Q    = new URLSearchParams(location.search);
const U    = 1000;
const OUT  = +(Q.get('w')  ?? 1080);
const SS   = +(Q.get('ss') ?? 2);
const DEV  = OUT * SS, S = DEV / U;
const FLAT = Q.get('flat') === '1';
// the final surface. these three are what turn a clean drawing into a
// printed one, and they run over the composite, not per shape.
const SOFT   = +(Q.get('soft')   ?? .62);   // blur in delivered px, BEFORE the grain
const CHROMA = +(Q.get('chroma') ?? .7);    // grain amount
const CHROMB = +(Q.get('chromb') ?? .7);    // blue-yellow grain
const SPREAD = +(Q.get('spread') ?? .9);    // channel displacement in px
const TAU  = Math.PI * 2;

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp  = (a, b, t) => a + (b - a) * t;
function rng(seed) {
  let a = (seed * 1000003) >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hex   = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
const toHex = a => '#' + a.map(v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const mix   = (a, b, t) => toHex(hex(a).map((v,i) => lerp(v, hex(b)[i], t)));
const tint  = (c, t) => mix(c, '#ffffff', t);
const shade = (c, t) => mix(c, '#000000', t);
const alph  = (c, a) => { const [r,g,b] = hex(c); return `rgba(${r},${g},${b},${a})`; };

// ---- 4. THE INK COVERAGE FIELD --------------------------------------
// Two octaves of smoothed value noise over the whole sheet. Every screen
// and every fill samples it, with a per ink offset so the plates are
// uneven in DIFFERENT places, which is what makes the overlaps mottle
// instead of just getting darker together.
function octave(seed, N) {
  const r = rng(seed), f = [];
  for (let i = 0; i < (N+1)*(N+1); i++) f.push(r());
  return (x, y) => {
    const u = clamp(x / U, 0, 1) * N, v = clamp(y / U, 0, 1) * N;
    const x0 = Math.min(N-1, u|0), y0 = Math.min(N-1, v|0);
    const ax = u - x0, ay = v - y0;
    const sx = ax*ax*(3-2*ax), sy = ay*ay*(3-2*ay);
    const a = f[y0*(N+1)+x0], b = f[y0*(N+1)+x0+1];
    const p = f[(y0+1)*(N+1)+x0], q = f[(y0+1)*(N+1)+x0+1];
    return (a*(1-sx)+b*sx)*(1-sy) + (p*(1-sx)+q*sx)*sy;
  };
}
function inkField(seed) {
  const lo = octave(seed, 7), hi = octave(seed + 91, 23);
  return (x, y) => lo(x, y) * .68 + hi(x, y) * .32;
}
const FIELD = { yellow: inkField(11), orange: inkField(23), magenta: inkField(37),
                green: inkField(51), ink: inkField(67), dark: inkField(83) };
// density as a function of place: base, swung by `amt` of the field
const cov = (base, amt, which = 'ink') => {
  const f = FIELD[which];
  return (x, y) => clamp(base * (1 - amt + 2 * amt * f(x, y)), 0, 1);
};

// ---- the inks -------------------------------------------------------
const PAPER  = '#F3EFE3';
const YELLOW = '#F2C63A';
const LEMON  = '#F8DC33';
const ORANGE = '#E4602A';
const VERM   = '#D4512A';
const MAGENTA= '#DC3F88';
const GREEN  = '#2F7439';
const OLIVE  = '#55511E';
const DARK   = '#1E2A12';
const INK    = '#15130E';

// ---- canvas ---------------------------------------------------------
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
cvs.width = OUT; cvs.height = OUT;
const big = document.createElement('canvas'); big.width = big.height = DEV;
const c = big.getContext('2d');
c.setTransform(S, 0, 0, S, 0, 0);
c.lineCap = 'round'; c.lineJoin = 'round';

// ---- marks ----------------------------------------------------------
function wob(pts, amp, seed, close = false) {
  const r = rng(seed);
  c.beginPath();
  pts.forEach((p,i) => { const x = p[0]+(r()-.5)*amp, y = p[1]+(r()-.5)*amp; i ? c.lineTo(x,y) : c.moveTo(x,y); });
  if (close) c.closePath();
  c.stroke();
}
// ---- 3. CONTOUR MODULATION ------------------------------------------
// An outline is never one width and never unbroken. Each span gets its
// own weight, its own alpha and its own small wander, and now and then
// the boundary simply stops.
function edge(pts, color, w, seed, close = true, { gap = .07, swing = 1.3, al = .9 } = {}) {
  const r = rng(seed), n = pts.length, lim = close ? n : n - 1;
  // A short path has few spans, so dropping one in fourteen takes a
  // visible bite out of it. The owl's mouth came out as a row of dots
  // because of this. Below about two dozen spans, nothing is dropped.
  if (n < 24) gap = 0;
  c.save(); c.strokeStyle = color;
  for (let i = 0; i < lim; i++) {
    if (r() < gap) continue;
    const p0 = pts[i], p1 = pts[(i+1) % n];
    c.globalAlpha = al * (.62 + r() * .38);
    c.lineWidth = w * (.40 + r() * swing);
    const j = () => (r() - .5) * w * .7;
    c.beginPath(); c.moveTo(p0[0]+j(), p0[1]+j()); c.lineTo(p1[0]+j(), p1[1]+j()); c.stroke();
  }
  c.restore();
}
function grain(path, box, n, color, al, seed, size = 1.8) {
  const r = rng(seed);
  c.save(); c.clip(path); c.fillStyle = color; c.globalAlpha = al;
  for (let i = 0; i < n; i++) c.fillRect(box[0]+r()*box[2], box[1]+r()*box[3], size*(.4+r()), size*(.4+r()));
  c.restore();
}
function hatch(path, box, o = {}) {
  const { angle = .9, gap = 7, len = 14, jitter = 5, color = INK, alpha: al = .3, width = 1.2, seed = 1 } = o;
  const r = rng(seed);
  c.save(); c.clip(path); c.strokeStyle = color; c.globalAlpha = al; c.lineWidth = width;
  const [bx,by,bw,bh] = box, cx = bx+bw/2, cy = by+bh/2, R = Math.hypot(bw,bh)/2, ca = Math.cos(angle), sa = Math.sin(angle);
  c.beginPath();
  for (let v = -R; v <= R; v += gap) for (let u = -R; u <= R; u += len*1.7) {
    const uu = u + (r()-.5)*jitter*2, L = len*(.6+r()*.8);
    const x0 = cx+ca*uu-sa*v+(r()-.5)*jitter*.6, y0 = cy+sa*uu+ca*v+(r()-.5)*jitter*.6;
    c.moveTo(x0,y0); c.lineTo(x0+ca*L, y0+sa*L);
  }
  c.stroke(); c.restore();
}
// ---- 1. HALFTONE ----------------------------------------------------
// Finer than before, and its density comes from the ink field, so
// coverage drifts across a shape instead of sitting flat under a pattern.
function dotScreen(path, box, o = {}) {
  const { cell = 12, color = INK, density = .5, angle = 0, jitter = .16, seed = 1, alpha: al = 1, field = 'ink', vary = .22 } = o;
  if (FLAT) return;
  const r = rng(seed);
  const dens = typeof density === 'function' ? density : cov(density, vary, field);
  c.save(); c.clip(path); c.fillStyle = color;
  const [bx,by,bw,bh] = box, cx = bx+bw/2, cy = by+bh/2, R = Math.hypot(bw,bh)/2;
  const ca = Math.cos(angle), sa = Math.sin(angle);
  // three cores at three opacities, plus one soft halo under all of them.
  // a dot that is a crisp circle at one alpha reads as placed ON a colour;
  // this lets it sink INTO the tone.
  const core = [new Path2D(), new Path2D(), new Path2D()], halo = new Path2D();
  for (let v = -R; v <= R; v += cell) for (let u = -R; u <= R; u += cell) {
    const x = cx+ca*u-sa*v+(r()-.5)*jitter*cell, y = cy+sa*u+ca*v+(r()-.5)*jitter*cell;
    const d = clamp(dens(x,y), 0, 1); if (d <= .02) continue;
    const rad = cell*.62*Math.sqrt(d)*(.82+r()*.36);
    const k = (r()*3)|0;
    core[k].moveTo(x+rad, y); core[k].arc(x, y, rad, 0, TAU);
    halo.moveTo(x+rad*1.45, y); halo.arc(x, y, rad*1.45, 0, TAU);
  }
  c.globalAlpha = al * .13; c.fill(halo);
  for (let k = 0; k < 3; k++) { c.globalAlpha = al * (.66 + .17 * k); c.fill(core[k]); }
  c.restore();
}
// ---- 5. REGISTRATION -------------------------------------------------
// A shifted copy of a shape in a neighbouring ink, showing only at the
// edge. This is the coloured fringe, and it goes on most shapes, not one.
function fringe(path, color, dx, dy, al = .5, wide = 7) {
  c.save(); c.globalAlpha = al; c.strokeStyle = color; c.lineWidth = wide;
  c.translate(dx, dy); c.stroke(path); c.restore();
}
// ---- 6. MARK MORPHOLOGY ----------------------------------------------
// A feather mark: short, tapered, and angular. Two straight runs meeting
// at a slight break, thick at the shoulder and dry at the tip. Nothing
// like the long even curve this replaced.
function feather(x, y, ang, len, w, color, seed, al = .92) {
  const r = rng(seed);
  const brk = (r() - .5) * .6;
  const mx = x + Math.cos(ang) * len * .55, my = y + Math.sin(ang) * len * .55;
  const ex = mx + Math.cos(ang + brk) * len * .5, ey = my + Math.sin(ang + brk) * len * .5;
  // the two normals the wedge is built across
  const n1 = ang + Math.PI/2, n2 = ang + brk + Math.PI/2;
  const half = w * .5;
  const pts = [
    [x + Math.cos(n1)*half*.62,  y + Math.sin(n1)*half*.62],
    [mx + Math.cos(n1)*half,     my + Math.sin(n1)*half],
    [ex, ey],
    [mx - Math.cos(n2)*half,     my - Math.sin(n2)*half],
    [x - Math.cos(n1)*half*.62,  y - Math.sin(n1)*half*.62],
  ];
  c.save(); c.globalAlpha = al; c.fillStyle = color;
  c.beginPath();
  pts.forEach((q,i) => i ? c.lineTo(q[0],q[1]) : c.moveTo(q[0],q[1]));
  c.closePath(); c.fill();
  c.restore();
}
function nib(x0, y0, x1, y1, w, bend, color, seed, al = 1) {
  const n = 10, mx = (x0+x1)/2, my = (y0+y1)/2, dx = x1-x0, dy = y1-y0;
  const bx = mx-dy*bend, by = my+dx*bend, r = rng(seed);
  c.save(); c.strokeStyle = color; c.globalAlpha = al;
  const at = t => { const m = 1-t; return [m*m*x0+2*m*t*bx+t*t*x1, m*m*y0+2*m*t*by+t*t*y1]; };
  for (let i = 0; i < n; i++) {
    const t0 = i/n, t1 = (i+1)/n, s = (t0+t1)/2;
    const [ax,ay] = at(t0), [cx2,cy2] = at(t1);
    c.lineWidth = Math.max(.4, w * Math.sin(Math.PI*Math.pow(s,.7))**.55 * (.85+.3*r()));
    c.beginPath(); c.moveTo(ax,ay); c.lineTo(cx2,cy2); c.stroke();
  }
  c.restore();
}
// geometry
const ellPts = (cx, cy, rx, ry, rot = 0, n = 64) => {
  const p = [];
  for (let i = 0; i < n; i++) { const a = i/n*TAU, x = rx*Math.cos(a), y = ry*Math.sin(a);
    p.push([cx + x*Math.cos(rot) - y*Math.sin(rot), cy + x*Math.sin(rot) + y*Math.cos(rot)]); }
  return p;
};
const polyPath = (pts, close = true) => { const p = new Path2D(); pts.forEach((q,i) => i ? p.lineTo(q[0],q[1]) : p.moveTo(q[0],q[1])); if (close) p.closePath(); return p; };
// a contour that already wanders, so a fill has a drawn edge before any
// outline goes near it
const rough = (pts, amp, seed, close = true) => {
  const r = rng(seed);
  return { path: polyPath(pts.map(p => [p[0]+(r()-.5)*amp, p[1]+(r()-.5)*amp]), close), pts };
};
const bezPts = (segs, per = 16) => {
  const out = [];
  for (const [p0,p1,p2] of segs) for (let i = 0; i <= per; i++) {
    const t = i/per, m = 1-t;
    out.push([m*m*p0[0]+2*m*t*p1[0]+t*t*p2[0], m*m*p0[1]+2*m*t*p1[1]+t*t*p2[1]]);
  }
  return out;
};
// a flat fill whose coverage already drifts: the solid, then a thin veil
// of paper knocked back where the field says the ink took badly
function inkFill(path, box, color, seed, which = 'ink', bite = .14) {
  c.save(); c.fillStyle = color; c.fill(path); c.restore();
  if (FLAT) return;
  const f = FIELD[which], r = rng(seed);
  c.save(); c.clip(path); c.fillStyle = PAPER;
  const [bx,by,bw,bh] = box;
  for (let i = 0; i < 900; i++) {
    const x = bx+r()*bw, y = by+r()*bh;
    const k = 1 - f(x, y);
    if (k < .5) continue;
    c.globalAlpha = bite * (k - .5) * 2 * (.4 + r() * .9);
    c.beginPath(); c.arc(x, y, 1.6 + r()*4.2, 0, TAU); c.fill();
  }
  c.restore();
}

// ==================================================================
// THE PICTURE
// ==================================================================
const R = rng(97);
c.fillStyle = PAPER; c.fillRect(0, 0, U, U);

if (Q.get('field') === '1') {                     // look at the coverage field itself
  for (let y = 0; y < U; y += 4) for (let x = 0; x < U; x += 4) {
    const v = FIELD.ink(x, y); c.fillStyle = `rgb(${v*255|0},${v*255|0},${v*255|0})`; c.fillRect(x, y, 4, 4);
  }
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(big, 0, 0, DEV, DEV, 0, 0, OUT, OUT);
  document.title = 'field ready';
} else {

// --- 7. the pale outer field --------------------------------------
// Quiet, and it gives up detail so the owl can keep it. Coarse cell,
// low densities, paper doing most of the work.
const BGpts = [[676,-40],[1042,-40],[1042,1042],[694,1042]];
const BG = rough(BGpts, 9, 11);
const BGbox = [660,-50,400,1110];
dotScreen(BG.path, BGbox, { cell: 17, color: YELLOW,  density: .40, angle: .02, seed: 2, alpha: 1.0, field: 'yellow', vary: .40 });
dotScreen(BG.path, BGbox, { cell: 17, color: VERM,    density: .36, angle: .55, seed: 3, alpha: 1.0, field: 'orange', vary: .48 });
dotScreen(BG.path, BGbox, { cell: 17, color: MAGENTA, density: .20, angle: .95, seed: 4, alpha: 1.0, field: 'magenta', vary: .52 });

// --- the owl's field ----------------------------------------------
const BODY = rough([[-42,-42],[520,-42],[520,1042],[-42,1042]], 5, 21);
inkFill(BODY.path, [-50,-50,580,1110], YELLOW, 22, 'yellow', .16);
dotScreen(BODY.path, [-50,250,580,800], { cell: 12, color: ORANGE, density: .24, angle: .40, seed: 5, alpha: .62, field: 'orange', vary: .34 });

// --- 2 + 7. the dense dark centre ---------------------------------
// A broad mass. It carries NO fine dot screen, because it is the bottom
// of the frequency ladder: the eye should read it as weight, not texture.
const TRUNK_L = bezPts([[[430,-42],[472,170],[452,356]],[[452,356],[432,520],[468,688]],[[468,688],[502,852],[486,1042]]]);
const TRUNK_R = bezPts([[[706,1042],[658,858],[688,700]],[[688,700],[716,540],[678,378]],[[678,378],[642,218],[674,-42]]]);
const TRUNK = rough([...TRUNK_L, ...TRUNK_R], 7, 31);
const TRUNKbox = [420,-50,300,1110];
// no hatch, no bite: see reference/surface.md on the frequency ladder
inkFill(TRUNK.path, TRUNKbox, DARK, 32, 'dark', .02);
// see reference/surface.md: these used to be clipped to the trunk, which
// concentrated every speck into the darkest thing on the page and made it
// boil at twice the reference's variation. Spread over the whole sheet at
// the same count, the dark gets its share and the surface is continuous.
const SHEET = new Path2D(); SHEET.rect(0, 0, U, U);
// sheet grain and the blur trade against each other IN THE DARKS: drop the
// blur and the same specks start to read. these alphas are set for the .62
// blur above, and both numbers move together or the dark boils.
grain(SHEET, [0,0,U,U], 22000, GREEN,     .13, 33, .70);
grain(SHEET, [0,0,U,U], 17000, ORANGE,    .13, 34, .64);
grain(SHEET, [0,0,U,U], 12000, '#3A3A66', .09, 36, .58);
// its fringes: two inks, two directions
fringe(TRUNK.path, ORANGE, -4, 2, .55, 11);
fringe(TRUNK.path, GREEN, 5, -3, .40, 8);
edge(TRUNK_L, ORANGE, 12, 41, false, { gap: .10, swing: 1.5 });
edge(TRUNK_R, ORANGE, 9, 42, false, { gap: .12, swing: 1.5 });

// the ridge down the right of the trunk
const ridgePts = TRUNK_R.map(([x,y]) => [x+34, y]);
const RIDGE = (() => { const r = rng(44);
  const a = ridgePts.map(([x,y]) => [x-30+(r()-.5)*8, y]), b = ridgePts.map(([x,y]) => [x+30+(r()-.5)*8, y]).reverse();
  return polyPath([...a, ...b]); })();
c.save(); c.globalAlpha = .92; c.fillStyle = LEMON; c.fill(RIDGE); c.restore();
dotScreen(RIDGE, [600,-50,180,1110], { cell: 11, color: GREEN, density: .58, angle: .6, seed: 45, alpha: .82, field: 'green', vary: .40 });
edge(ridgePts.map(([x,y]) => [x+24,y]), INK, 4.5, 46, false, { gap: .16, swing: 1.6, al: .55 });

// --- 8. the grass, on the same printed surface --------------------
// Drawn, then given the same screen and grain as the field it sits in,
// clipped to its own region, so it stops looking pasted on.
const GRASSbox = [690, 580, 360, 470];
const GRASS = polyPath([[690,600],[1042,560],[1042,1042],[690,1042]]);
c.save(); c.clip(GRASS);
for (let i = 0; i < 46; i++) {
  const x0 = 700+R()*300, y0 = 620+R()*300;
  nib(x0, y0, x0+60+R()*180, y0+130+R()*250, 5+R()*5, (R()-.5)*.22, GREEN, i+40, .95);
}
for (let i = 0; i < 20; i++) {
  const x0 = 720+R()*290, y0 = 660+R()*290;
  nib(x0, y0, x0+50+R()*160, y0+120+R()*230, 2.6+R()*2.6, (R()-.5)*.2, shade(GREEN,.45), i+90, .7);
}
c.restore();
dotScreen(GRASS, GRASSbox, { cell: 17, color: YELLOW, density: .30, angle: .02, seed: 47, alpha: .22, field: 'yellow', vary: .35 });
dotScreen(GRASS, GRASSbox, { cell: 17, color: VERM,   density: .12, angle: .55, seed: 48, alpha: .22, field: 'orange', vary: .40 });
grain(GRASS, GRASSbox, 700, shade(GREEN,.4), .16, 49, 2.4);

// --- the wing -----------------------------------------------------
const WINGpts = ellPts(368, 700, 126, 368, .055, 96);
const WING = rough(WINGpts, 5, 51);
const WINGbox = [230,320,280,760];
inkFill(WING.path, WINGbox, OLIVE, 52, 'green', .20);
dotScreen(WING.path, WINGbox, { cell: 13, color: YELLOW, density: .60, angle: .10, seed: 53, alpha: .55, field: 'yellow', vary: .32 });
dotScreen(WING.path, WINGbox, { cell: 13, color: VERM,   density: .26, angle: .78, seed: 57, alpha: .45, field: 'orange', vary: .40 });
dotScreen(WING.path, WINGbox, { cell: 13, color: GREEN,  density: .30, angle: 1.3, seed: 58, alpha: .40, field: 'green',  vary: .38 });
hatch(WING.path, WINGbox, { angle: .35, gap: 13, len: 30, jitter: 6, color: INK, alpha: .26, width: 2.8, seed: 54 });
// the barring, now as ranks of short angular marks rather than long bars
c.save(); c.clip(WING.path);
for (let i = 0; i < 12; i++) {
  const y = 356 + i*66 + (R()-.5)*10;
  const n = 3 + (R()*2|0);
  for (let k = 0; k < n; k++) {
    const x = 250 + k*(240/n) + (R()-.5)*20;
    feather(x, y + (R()-.5)*14, .22 + (R()-.5)*.42, 50 + R()*46, 16 + R()*10, INK, i*40+k, .92);
  }
}
c.restore();
fringe(WING.path, ORANGE, -5, 3, .6, 12);
edge(WINGpts, INK, 5, 56, true, { gap: .09, swing: 1.4, al: .82 });

// --- 6. the breast, in feather tracts -----------------------------
// Short tapered angular marks whose direction follows the tract, not a
// row of identical decorative curves.
for (let row = 0; row < 24; row++) {
  const y = 316 + row * 31;
  const n = 5 + (R()*3|0);
  for (let i = 0; i < n; i++) {
    const x = -50 + R()*300;
    if (x > 232 && y < 470) continue;
    // the tract: marks sweep outward and down as they leave the centre
    const ang = -.30 + (x + 60) / 340 * .62 + (R()-.5) * .40;
    const q = R();
    const col = q < .66 ? INK : q < .88 ? shade(GREEN,.15) : shade(ORANGE,.2);
    feather(x, y + (R()-.5)*13, ang, 30 + R()*38, 9 + R()*8, col, row*17+i, .94);
  }
}

// --- the head -----------------------------------------------------
const DISCpts = ellPts(168, 44, 242, 252, -.04, 96);
const DISC = rough(DISCpts, 6, 61);
const DISCbox = [-80,-220,500,530];
inkFill(DISC.path, DISCbox, VERM, 62, 'orange', .14);
dotScreen(DISC.path, DISCbox, { cell: 11, color: ORANGE, density: .32, angle: .5, seed: 63, alpha: .62, field: 'orange', vary: .45 });
grain(DISC.path, DISCbox, 520, shade(VERM,.75), .44, 64, 2.4);
grain(DISC.path, DISCbox, 150, MAGENTA, .28, 65, 2.2);
grain(DISC.path, DISCbox, 120, tint(PAPER,.4), .18, 66, 2.2);
fringe(DISC.path, MAGENTA, 4, -3, .40, 8);
fringe(DISC.path, ORANGE, -4, 3, .45, 9);
edge(DISCpts, shade(VERM,.4), 4, 67, true, { gap: .14, swing: 1.5, al: .55 });

const TUFT = rough([[300,10],[410,126],[268,104]], 5, 68);
inkFill(TUFT.path, [260,0,160,140], VERM, 69, 'orange', .2);
grain(TUFT.path, [260,0,160,140], 70, shade(VERM,.6), .45, 70, 2.4);

// the cream V
const Vpts = [[62,-42],[116,-42],[140,150],[164,-42],[212,-42],[158,200],[122,204]];
const VEE = rough(Vpts, 4, 71);
c.save(); c.fillStyle = tint(PAPER,.45); c.fill(VEE.path); c.restore();
fringe(VEE.path, MAGENTA, 3, -2, .45, 5);
edge(Vpts, alph(shade(VERM,.3), .55), 2.6, 72, true, { gap: .18, swing: 1.4 });

// the eyes
for (const [ex, ey, rr, seed] of [[43,66,78,81],[262,105,82,85]]) {
  const outerP = ellPts(ex,ey,rr,rr,0,80), ringP = ellPts(ex,ey,rr*.87,rr*.87,0,80), pupP = ellPts(ex,ey,rr*.55,rr*.55,0,72);
  const outer = rough(outerP, 4, seed), ring = rough(ringP, 3.4, seed+1), pup = rough(pupP, 2.8, seed+2);
  c.save(); c.fillStyle = INK; c.fill(outer.path); c.restore();
  inkFill(ring.path, [ex-rr,ey-rr,rr*2,rr*2], LEMON, seed+3, 'yellow', .16);
  grain(ring.path, [ex-rr,ey-rr,rr*2,rr*2], 110, ORANGE, .26, seed+4, 2.2);
  c.save(); c.fillStyle = INK; c.fill(pup.path); c.restore();
  grain(pup.path, [ex-rr,ey-rr,rr*2,rr*2], 60, '#2B3A7A', .30, seed+5, 2.4);
  const cl = rough(ellPts(ex-rr*.20, ey-rr*.24, rr*.19, rr*.10, -.6, 36), 2, seed+6);
  c.save(); c.globalAlpha = .92; c.fillStyle = tint(PAPER,.6); c.fill(cl.path); c.restore();
  fringe(ring.path, MAGENTA, 4, -3, .38, 5);
  edge(outerP, INK, 4, seed+7, true, { gap: .10, swing: 1.5, al: .7 });
}

// the beak and the mouth
const BEAK = rough([[114,138],[140,143],[133,206],[122,188]], 3, 91);
c.save(); c.fillStyle = INK; c.fill(BEAK.path); c.restore();
fringe(BEAK.path, ORANGE, -3, 2, .5, 4);
(() => {                                   // the smile: one curved wedge

  const bot = bezPts([[[294,268],[248,318],[198,272]]]);
  c.save(); c.fillStyle = INK; c.globalAlpha = .96;

  c.closePath(); c.fill(); c.restore();
})();

// the throat
const THROATpts = bezPts([[[-42,296],[64,282],[178,314]],[[178,314],[252,336],[214,424]],[[214,424],[118,472],[-42,450]]]);
const THROAT = rough(THROATpts, 6, 93);
c.save(); c.fillStyle = tint(PAPER,.5); c.fill(THROAT.path); c.restore();
grain(THROAT.path, [-50,290,280,190], 52, '#3C6FA8', .65, 94, 4.5);
grain(THROAT.path, [-50,290,280,190], 28, GREEN, .5, 95, 4.0);

// the whiskers
[[58,164,21,327],[93,179,56,345],[132,204,95,370],[164,197,127,364]]
  .forEach((w,i) => nib(w[0],w[1],w[2],w[3], 3.4, .05, shade(GREEN,.2), i+300, .9));
nib(62,168,25,331, 2.4, .05, INK, 310, .75);
nib(136,208,99,374, 2.4, .05, INK, 311, .75);

// the dot
const D = 17;
c.save(); c.fillStyle = tint(PAPER,.7); c.fill(rough(ellPts(505,500,D+4,D+4,0,44),1.6,97).path);
c.fillStyle = MAGENTA; c.fill(rough(ellPts(506,501,D-1,D-1,0,44),1.4,98).path);

// --- the stock ----------------------------------------------------
const full = new Path2D(); full.rect(0,0,U,U);
grain(full, [0,0,U,U], 5200, shade(PAPER,.55), .05, 100, 1.6);

// ==================================================================
// THE SURFACE. Everything above draws. This prints it.
//
// The grain here is CLUSTERED, not per pixel. Four small tiling grids of
// roughly gaussian noise, sampled bilinearly at about four output pixels
// per texel, so neighbours vary together. Per pixel rng() gives digital
// static; this gives mottled ink, and it is the single biggest thing
// separating a computed surface from a printed one.
//
// Two blurs, not one. A wider one BEFORE the grain so outlines, dots and
// fills all soften together, and a small one AFTER so the grain itself is
// absorbed rather than sitting on top as speckle.
// ==================================================================
const GS = 260, gr = rng(4242);
const GRAIN = Array.from({ length: 4 }, () => {
  const d = new Float32Array(GS * GS);
  // three uniforms summed is near enough gaussian, and gaussian is what
  // stops the grain looking like a dither pattern
  for (let i = 0; i < d.length; i++) d[i] = (gr() + gr() + gr() - 1.5) * 2;
  return d;
});
function sampleGrain(g, x, y) {
  x = (x % GS + GS) % GS; y = (y % GS + GS) % GS;
  const ix = x|0, iy = y|0, fx = x-ix, fy = y-iy, nx = (ix+1)%GS, ny = (iy+1)%GS;
  return lerp(lerp(g[iy*GS+ix], g[iy*GS+nx], fx), lerp(g[ny*GS+ix], g[ny*GS+nx], fx), fy);
}

const base = document.createElement('canvas'); base.width = base.height = OUT;
const bg = base.getContext('2d', { willReadFrequently: true });
const scale = OUT / U;

// pass one: soften the whole composite, then resolve it down
bg.filter = 'blur(' + (SOFT * scale) + 'px)';
bg.imageSmoothingEnabled = true; bg.imageSmoothingQuality = 'high';
bg.drawImage(big, 0, 0, DEV, DEV, 0, 0, OUT, OUT);
bg.filter = 'none';

// pass two: ink spread and grain, one walk
const img = bg.getImageData(0, 0, OUT, OUT), src = img.data;
const out = new Uint8ClampedArray(src.length);
// bilinear, so the channel displacement is subpixel and smooth. integer
// offsets step and read as a coloured jaggy.
const at = (x, y, k) => {
  x = clamp(x, 0, OUT-1); y = clamp(y, 0, OUT-1);
  const ix = x|0, iy = y|0, fx = x-ix, fy = y-iy, nx = Math.min(ix+1, OUT-1), ny = Math.min(iy+1, OUT-1);
  return lerp(lerp(src[(iy*OUT+ix)*4+k], src[(iy*OUT+nx)*4+k], fx),
              lerp(src[(ny*OUT+ix)*4+k], src[(ny*OUT+nx)*4+k], fx), fy);
};
for (let y = 0; y < OUT; y++) for (let x = 0; x < OUT; x++) {
  const i = (y*OUT + x) * 4, gx = x/OUT*GS, gy = y/OUT*GS;
  const n      = sampleGrain(GRAIN[0], gx, gy);
  const rgn    = sampleGrain(GRAIN[1], gx+.7, gy+.3);
  const byn    = sampleGrain(GRAIN[2], gx, gy);
  const coarse = sampleGrain(GRAIN[3], gx*.31, gy*.31);   // slow, wandering
  // the plates did not land together, and how far out they are drifts
  const dx = (.45 + coarse*.28) * SPREAD * scale, dy = .18 * SPREAD * scale;
  let R = at(x+dx, y-dy, 0), G = at(x, y, 1), B = at(x-dx*.7, y+dy, 2);
  // more grain where there is more ink, on a gentle curve. sqrt, not
  // squared: squared leaves the midtones flat and piles it all in the darks.
  const lum = (R*.299 + G*.587 + B*.114) / 255, ink = 1 - lum;
  const amp = CHROMA * (.26 + .74 * Math.sqrt(ink));
  const luma = (n*8 + coarse*4) * amp;          // shared across channels
  R += luma + rgn*25*amp;                        // then the opponent axes
  G += luma - rgn*10*amp;
  B += luma + byn*17*amp;
  // PORES: where the grain peaks and there is ink, the ink simply did not
  // take. Toward PAPER, never toward white, or the gaps read as holes.
  const pore = Math.max(0, n - .68) * ink * .31 * CHROMA;
  R = lerp(R, 237, pore); G = lerp(G, 224, pore); B = lerp(B, 178, pore);
  out[i] = R; out[i+1] = G; out[i+2] = B; out[i+3] = 255;
}
img.data.set(out);
const finish = document.createElement('canvas'); finish.width = finish.height = OUT;
finish.getContext('2d').putImageData(img, 0, 0);

// pass three: the small blur that absorbs the grain into the surface
ctx.filter = 'blur(' + (.34 * scale) + 'px)';
ctx.drawImage(finish, 0, 0);
ctx.filter = 'none';
document.title = 'owl5 soft=' + SOFT + ' chroma=' + CHROMA + ' spread=' + SPREAD + ' ready';
}
